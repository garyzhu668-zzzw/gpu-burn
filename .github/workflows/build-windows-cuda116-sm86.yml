name: GPU-Burn Windows CUDA 11.6.2 SM86

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64 (CUDA 11.6.2 / SM86 / MSVC 14.29)
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout GPU-Burn source
        uses: actions/checkout@v4

      - name: Install MSVC v142 (14.29) toolset into Visual Studio 2022
        shell: pwsh
        timeout-minutes: 25
        run: |
          $ErrorActionPreference = "Stop"

          $installerDir = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer"
          $vswhere = Join-Path $installerDir "vswhere.exe"
          $setup = Join-Path $installerDir "setup.exe"

          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found: $vswhere" }
          if (-not (Test-Path $setup)) { throw "Visual Studio setup.exe not found: $setup" }

          $installPath = & $vswhere -products '*' -latest -property installationPath
          if (-not $installPath) { throw "Visual Studio 2022 installation path was not found." }

          Write-Host "Visual Studio installation: $installPath"
          $component = "Microsoft.VisualStudio.ComponentGroup.VC.Tools.142.x86.x64"
          $arguments = @(
            "modify",
            "--installPath", "`"$installPath`"",
            "--add", $component,
            "--quiet",
            "--norestart",
            "--nocache"
          )

          $proc = Start-Process -FilePath $setup -ArgumentList $arguments -Wait -PassThru
          Write-Host "VS Installer exit code: $($proc.ExitCode)"
          if ($proc.ExitCode -notin @(0, 3010)) {
            throw "Installing MSVC v142 failed with exit code $($proc.ExitCode)"
          }

          $toolRoot = Join-Path $installPath "VC\Tools\MSVC"
          $v142 = Get-ChildItem $toolRoot -Directory |
            Where-Object { $_.Name -like "14.29.*" } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1

          if (-not $v142) {
            Get-ChildItem $toolRoot -Directory | Select-Object -ExpandProperty Name
            throw "MSVC 14.29 toolset was not found after installation."
          }

          $cl = Join-Path $v142.FullName "bin\Hostx64\x64\cl.exe"
          if (-not (Test-Path $cl)) { throw "MSVC 14.29 x64 compiler not found: $cl" }
          Write-Host "Installed MSVC v142 compiler: $cl"

      - name: Set up MSVC x64 environment (14.29)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: "2022"
          toolset: "14.29"

      - name: Install CUDA Toolkit 11.6.2 from NVIDIA local installer (no display driver)
        shell: pwsh
        timeout-minutes: 30
        run: |
          $ErrorActionPreference = "Stop"

          $installer = Join-Path $env:RUNNER_TEMP "cuda_11.6.2_511.65_windows.exe"
          $url = "https://developer.download.nvidia.com/compute/cuda/11.6.2/local_installers/cuda_11.6.2_511.65_windows.exe"
          $expectedMd5 = "b5ca553bcf7e702a6bc454979aa87e65"

          Write-Host "Downloading NVIDIA CUDA Toolkit 11.6.2 full local installer..."
          curl.exe --location --fail --retry 4 --retry-delay 5 --silent --show-error `
            --output $installer $url
          if ($LASTEXITCODE -ne 0) {
            throw "CUDA local installer download failed: curl exit code $LASTEXITCODE"
          }
          if (-not (Test-Path $installer)) { throw "CUDA local installer file was not created." }

          $actualMd5 = (Get-FileHash -Path $installer -Algorithm MD5).Hash.ToLowerInvariant()
          Write-Host "CUDA installer MD5: $actualMd5"
          if ($actualMd5 -ne $expectedMd5) {
            throw "CUDA installer MD5 mismatch. Expected $expectedMd5, got $actualMd5"
          }

          # Install Toolkit components only. Deliberately omit Display.Driver.
          $arguments = "-s nvcc_11.6 cudart_11.6 cublas_11.6 cublas_dev_11.6 thrust_11.6"
          $proc = Start-Process -FilePath $installer `
            -ArgumentList $arguments -Wait -PassThru -NoNewWindow

          Write-Host "CUDA installer exit code: $($proc.ExitCode)"
          if ($proc.ExitCode -notin @(0, 3010)) {
            throw "CUDA Toolkit installer failed with exit code $($proc.ExitCode)"
          }

          $cudaRoot = Join-Path $env:ProgramFiles "NVIDIA GPU Computing Toolkit\CUDA\v11.6"
          $nvcc = Join-Path $cudaRoot "bin\nvcc.exe"
          $deadline = (Get-Date).AddMinutes(10)

          while (-not (Test-Path $nvcc) -and (Get-Date) -lt $deadline) {
            Write-Host "Waiting for nvcc.exe..."
            Start-Sleep -Seconds 10
          }

          if (-not (Test-Path $nvcc)) {
            if (Test-Path $cudaRoot) { Get-ChildItem $cudaRoot -Force | Format-Table Name, Mode }
            throw "nvcc.exe was not found after CUDA Toolkit installation."
          }

          "CUDA_PATH=$cudaRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$cudaRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          & $nvcc --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify selected MSVC and CUDA compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== cl.exe path ====="
          $clPath = (Get-Command cl.exe -ErrorAction Stop).Source
          Write-Host $clPath
          if ($clPath -notmatch '\\14\.29\.') {
            throw "Expected MSVC 14.29, but PATH selected: $clPath"
          }

          Write-Host "===== VCToolsVersion ====="
          Write-Host $env:VCToolsVersion
          if ($env:VCToolsVersion -notlike "14.29*") {
            throw "Expected VCToolsVersion 14.29.x, got: $env:VCToolsVersion"
          }

          Write-Host "===== CUDA nvcc ====="
          & "$env:CUDA_PATH\bin\nvcc.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Write-Host "===== CMake ====="
          cmake --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure GPU-Burn for A40 (SM86) with v142
        shell: pwsh
        run: |
          cmake -S win -B build-win `
            -G "Visual Studio 17 2022" -A x64 -T v142 `
            -DCOMPUTE=86 `
            "-DCUDAToolkit_ROOT=$env:CUDA_PATH"

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Release
        shell: pwsh
        run: |
          cmake --build build-win --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package executable and runtime dependencies (fixed CRT detection)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = $env:GITHUB_WORKSPACE
          $buildDir = Join-Path $root "build-win\Release"
          $dist = Join-Path $root "dist\GPU_Burn_A40_Windows_CUDA116_SM86"

          New-Item -ItemType Directory -Path $dist -Force | Out-Null

          # The Release build has already succeeded. Copy the actual build outputs.
          foreach ($fileName in @("gpu_burn.exe", "compare.fatbin")) {
            $source = Join-Path $buildDir $fileName
            if (-not (Test-Path $source)) {
              Write-Host "Build output directory contents:"
              if (Test-Path $buildDir) {
                Get-ChildItem $buildDir -Force | Format-Table Name, Length
              }
              throw "Build output missing: $source"
            }
            Copy-Item $source -Destination $dist -Force
          }

          # Bundle CUDA runtime DLLs, but never bundle or install the NVIDIA display driver.
          $cudaBin = Join-Path $env:CUDA_PATH "bin"
          foreach ($dll in @("cudart64_110.dll", "cublas64_11.dll", "cublasLt64_11.dll")) {
            $source = Join-Path $cudaBin $dll
            if (-not (Test-Path $source)) {
              throw "Required CUDA runtime DLL missing: $source"
            }
            Copy-Item $source -Destination $dist -Force
          }

          # Locate the app-local MSVC CRT files.
          # Do not cast every directory name to [version]: this folder can also
          # contain labels such as "v143", which are not numeric version strings.
          $programFilesX86 = [Environment]::GetFolderPath("ProgramFilesX86")
          $vswhere = Join-Path $programFilesX86 "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe not found: $vswhere"
          }

          $vsPath = (& $vswhere -latest -products * -property installationPath | Select-Object -First 1).Trim()
          if (-not $vsPath) {
            throw "Visual Studio installation path was not found."
          }

          $crtDir = $null
          $crtNames = @("Microsoft.VC142.CRT", "Microsoft.VC143.CRT")

          # First use the redistributable path selected by the active MSVC environment, if available.
          if ($env:VCToolsRedistDir) {
            Write-Host "VCToolsRedistDir=$env:VCToolsRedistDir"
            foreach ($crtName in $crtNames) {
              $candidate = Join-Path $env:VCToolsRedistDir "x64\$crtName"
              if (Test-Path $candidate) {
                $crtDir = $candidate
                break
              }
            }
          }

          $crtRoot = Join-Path $vsPath "VC\Redist\MSVC"

          # Fallback: consider only genuinely numeric version directories.
          # This deliberately excludes directory names such as "v143".
          if (-not $crtDir -and (Test-Path $crtRoot)) {
            $numericRedistDirs = @(
              Get-ChildItem $crtRoot -Directory |
                Where-Object { $_.Name -match '^\d+(\.\d+){1,3}$' } |
                Sort-Object { [version]$_.Name } -Descending
            )

            foreach ($versionDir in $numericRedistDirs) {
              foreach ($crtName in $crtNames) {
                $candidate = Join-Path $versionDir.FullName "x64\$crtName"
                if (Test-Path $candidate) {
                  $crtDir = $candidate
                  break
                }
              }
              if ($crtDir) { break }
            }
          }

          # Last fallback: search for the x64 VC142/VC143 CRT directory directly.
          if (-not $crtDir -and (Test-Path $crtRoot)) {
            $crtMatch = Get-ChildItem $crtRoot -Directory -Recurse -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Name -in $crtNames -and
                $_.FullName -match '\\x64\\Microsoft\.VC14[23]\.CRT$'
              } |
              Select-Object -First 1

            if ($crtMatch) {
              $crtDir = $crtMatch.FullName
            }
          }

          if (-not $crtDir -or -not (Test-Path $crtDir)) {
            Write-Host "MSVC redist root: $crtRoot"
            Write-Host "VCToolsRedistDir: $env:VCToolsRedistDir"
            if (Test-Path $crtRoot) {
              Write-Host "MSVC redist directory entries:"
              Get-ChildItem $crtRoot -Force | Select-Object Name, FullName | Format-Table -AutoSize
            }
            throw "Could not locate an x64 Microsoft.VC142.CRT or Microsoft.VC143.CRT directory."
          }

          Write-Host "Using MSVC CRT directory: $crtDir"
          $crtFiles = @(Get-ChildItem $crtDir -File)
          if ($crtFiles.Count -eq 0) {
            throw "MSVC CRT directory contains no files: $crtDir"
          }

          # Copy DLLs and their app-local manifests/catalog files, when present.
          $crtFiles | Copy-Item -Destination $dist -Force

          if (Test-Path (Join-Path $root "LICENSE")) {
            Copy-Item (Join-Path $root "LICENSE") `
              (Join-Path $dist "GPU_Burn_LICENSE.txt") -Force
          }

          $commit = (git -C $root rev-parse HEAD).Trim()
          @"
          GPU-Burn Windows x64 package
          Source commit: $commit
          CUDA Toolkit: 11.6.2
          CUDA architecture: SM86 (compute capability 8.6)
          MSVC toolset: v142 / 14.29
          Build: Release / x64

          NVIDIA display driver is not included.
          Target Windows VM must already have a compatible NVIDIA Guest Driver.
          "@ | Set-Content (Join-Path $dist "BUILD_INFO.txt") -Encoding UTF8

          @'
          GPU-Burn A40 Windows package - CUDA 11.6.2 / SM86 / MSVC 14.29

          Extract this folder completely. Keep gpu_burn.exe, compare.fatbin and
          all DLL/manifest files together.

          1. Run 01_List_GPU.bat first.
          2. If the A40 vGPU is listed as GPU 0, run 02_Test_60s.bat.
          3. Open 03_Monitor_GPU.bat in a second window to watch nvidia-smi.

          This package includes CUDA 11.6 runtime DLLs and MSVC runtime files.
          It does not install or replace the NVIDIA display driver.
          The target Windows VM must already have a working NVIDIA Guest Driver.

          A40-2Q has 2 GB of assigned framebuffer memory. The 60-second test
          starts with -m 70% to limit the initial allocation. Close other
          GPU-accelerated applications before testing.

          Stop a running test with Ctrl+C. Run only in a designated test VM
          during a maintenance window. Do not run it on the ESXi host or on
          a production desktop.
          '@ | Set-Content (Join-Path $dist "README_CN.txt") -Encoding UTF8

          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          set "NVSMI_DIR=%ProgramFiles%\NVIDIA Corporation\NVSMI"
          if exist "%NVSMI_DIR%\nvidia-smi.exe" set "PATH=%NVSMI_DIR%;%PATH%"
          nvidia-smi
          echo.
          gpu_burn.exe -l
          pause
          '@ | Set-Content (Join-Path $dist "01_List_GPU.bat") -Encoding ASCII

          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          set "NVSMI_DIR=%ProgramFiles%\NVIDIA Corporation\NVSMI"
          if exist "%NVSMI_DIR%\nvidia-smi.exe" set "PATH=%NVSMI_DIR%;%PATH%"
          if not exist "gpu_burn.exe" echo ERROR: gpu_burn.exe missing & pause & exit /b 1
          if not exist "compare.fatbin" echo ERROR: compare.fatbin missing & pause & exit /b 1
          echo A40-2Q initial test: GPU 0, 70%% available memory, 60 seconds.
          echo Close other GPU applications first. Press Ctrl+C to stop.
          gpu_burn.exe -i 0 -m 70%% 60
          pause
          '@ | Set-Content (Join-Path $dist "02_Test_60s.bat") -Encoding ASCII

          @'
          @echo off
          setlocal
          set "NVSMI_DIR=%ProgramFiles%\NVIDIA Corporation\NVSMI"
          if exist "%NVSMI_DIR%\nvidia-smi.exe" set "PATH=%NVSMI_DIR%;%PATH%"
          nvidia-smi -l 1
          '@ | Set-Content (Join-Path $dist "03_Monitor_GPU.bat") -Encoding ASCII

          $zipPath = Join-Path $root "GPU_Burn_A40_Windows_CUDA116_SM86.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path (Join-Path $dist "*") `
            -DestinationPath $zipPath -CompressionLevel Optimal

          $hash = (Get-FileHash $zipPath -Algorithm SHA256).Hash
          "$hash  GPU_Burn_A40_Windows_CUDA116_SM86.zip" |
            Set-Content "$zipPath.sha256.txt" -Encoding ASCII

          Write-Host "Package created: $zipPath"
          Write-Host "SHA256: $hash"
          Write-Host "Package contents:"
          Get-ChildItem $dist -File | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload ready-to-run package
        uses: actions/upload-artifact@v4
        with:
          name: GPU_Burn_A40_Windows_CUDA116_SM86
          path: |
            GPU_Burn_A40_Windows_CUDA116_SM86.zip
            GPU_Burn_A40_Windows_CUDA116_SM86.zip.sha256.txt
          if-no-files-found: error
          retention-days: 14
